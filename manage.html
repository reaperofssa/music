<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Manage · @playlists</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--s1:#121212;--s2:#1c1c1c;--s3:#2c2c2c;--line:#262626;--text:#fff;--mut:#a3a3a3;--dim:#6b6b6b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:13px/1.4 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100svh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{width:1em;height:1em;fill:currentColor;display:block}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;transition:max-width .2s}
.wrap.wide{max-width:980px}
.hd{display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 0 4px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:7px}
.hd .sub{color:var(--mut);font-size:12px}
.sp{flex:1}
.pill{height:30px;padding:0 12px;border-radius:99px;background:var(--s2);font-size:12px;font-weight:600;white-space:nowrap;display:inline-grid;place-items:center}
.pill:hover{background:var(--s3)}
.pill.pri{background:#fff;color:#000}
.pill[disabled]{opacity:.4;cursor:default}
h1{font-size:clamp(24px,6vw,36px);font-weight:800;letter-spacing:-.03em;margin:14px 0 2px}
.meta{color:var(--mut);font-size:12px}

/* loading */
@keyframes sh{to{background-position:-200% 0}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:5px}
.fade{animation:fi .35s ease both}
img{opacity:0;transition:opacity .4s}img.ld{opacity:1}
.th:has(img:not(.ld)){background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.skr{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:7px 6px}
@media(prefers-reduced-motion:reduce){.sk,.fade,.th:has(img:not(.ld)){animation:none}}

/* tabs */
.tabs{display:flex;align-items:center;gap:6px;padding:12px 0 2px}
.tabs .t{height:32px;padding:0 16px;border-radius:99px;background:var(--s2);font-size:12px;font-weight:700}
.tabs .t.on{background:#fff;color:#000}
.tabs .st{font-size:11px;color:var(--mut)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:99px;background:var(--s2);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--s3)}
.chip.on{background:#fff;color:#000}
.chip small{color:var(--dim);font-weight:500}.chip.on small{color:#555}
.chip svg{font-size:12px;opacity:.7}
.chip.add{background:none;border:1px dashed var(--s3);color:var(--mut)}

.tb{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:8px 0;background:linear-gradient(var(--bg) 85%,transparent);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:99px;background:var(--s2);flex:1;max-width:260px;min-width:120px}
.search:focus-within{background:var(--s3)}
.search.wide{max-width:none;width:100%;flex:none}
.search svg{font-size:14px;color:var(--mut);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px}
.search input::placeholder{color:var(--dim)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.flt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.fc{height:26px;padding:0 6px 0 11px;border-radius:99px;background:var(--s3);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.fc svg{font-size:14px;color:var(--mut)}
.note{color:var(--mut);font-size:12px;padding:2px 0 8px}

.r{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;border-radius:5px;min-height:50px}
.r:hover{background:var(--s1)}.r.sel{background:var(--s2)}
.ck{display:grid;place-items:center;width:26px;height:26px;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--dim);background:none;cursor:pointer;display:grid;place-items:center}
.ck input:checked{background:#fff;border-color:#fff}
.ck input:checked::after{content:"";width:8px;height:4px;border:solid #000;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:disabled{opacity:.35;cursor:default}
.th{width:36px;height:36px;border-radius:3px;background:var(--s3);display:grid;place-items:center;font-size:13px;color:var(--dim);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.t{font-weight:600;font-size:13px}.a{color:var(--mut);font-size:12px}
.ac{display:flex;gap:0}
.ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--mut)}
.ib:hover:not([disabled]){color:#fff;background:var(--s3)}
.ib[disabled]{opacity:.25;cursor:default}
.state{padding:40px 16px;text-align:center;color:var(--mut)}
.more{text-align:center;color:var(--dim);font-size:11px;padding:10px;min-height:24px}

.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#000;border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.selbar b{margin-right:auto;font-size:12px}
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;place-items:end center}
.ov.show{display:grid}
.box{width:min(420px,100%);max-height:80svh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom))}
.box.big{width:min(560px,100%);height:88svh;max-height:88svh;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:720px){.ov{place-items:center}.box{border-radius:12px}.box.big{height:80svh}}
.bt{font-size:14px;font-weight:700;margin-bottom:6px}
.box p{margin-bottom:4px}
.box input[type=text],.box input:not([type]){width:100%;height:38px;border-radius:6px;background:var(--s2);border:1px solid var(--s3);padding:0 10px;outline:0;margin:8px 0 12px;font-size:14px}
.box input:focus{border-color:#fff}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.b{height:34px;padding:0 16px;border-radius:6px;background:var(--s2);font-weight:600}
.b.pri{background:#fff;color:#000}
.b[disabled]{opacity:.4;cursor:default}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 8px;border-radius:5px;font-size:14px}
.it:hover{background:var(--s2)}
.it small{color:var(--mut);font-size:12px}
.it.off{opacity:.45;cursor:default}.it.off:hover{background:none}
.it .d{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.fl2{max-height:48svh;overflow:auto;margin:0 -4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#fff;color:#000;padding:8px 14px;border-radius:6px;font-weight:600;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* song picker */
.pk{display:flex;flex-direction:column;min-height:0;flex:1}
.pk .tools2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pk .bar2{display:flex;align-items:center;gap:6px;padding:4px 0 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.pk-list{flex:1;overflow:auto;margin:0 -6px;min-height:0}
.pk .r{cursor:pointer}
.pk .r.in{opacity:.45;cursor:default}
.pk .tag{font-size:11px;color:var(--mut)}

/* appearance */
.lk{display:grid;gap:16px;grid-template-areas:"pv" "ctl";padding-top:12px}
.pvc{grid-area:pv;position:sticky;top:0;z-index:12;background:var(--bg);padding:8px 0}
.pvf{width:100%;height:250px;border:1px solid var(--line);border-radius:12px;background:#000;display:block}
.pvh{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:11px;padding:0 2px 6px}
.ctl{grid-area:ctl;display:grid;gap:12px;min-width:0}
@media(min-width:900px){.lk{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"ctl pv";align-items:start}.pvc{top:8px;padding:0}.pvf{height:min(660px,80svh)}}
.c2{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh h3{font-size:13px;font-weight:700}
.sh p{color:var(--mut);font-size:11px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fr:first-of-type{border-top:0}
.fl{font-size:12px;color:var(--mut);flex:none;min-width:84px}
.fr>.seg,.fr>.rg,.fr>.clr,.fr>.imgc,.fr>textarea{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.seg button{height:28px;padding:0 11px;border-radius:99px;background:var(--s2);font-size:12px;font-weight:600;text-transform:capitalize}
.seg button:hover{background:var(--s3)}
.seg button.on{background:#fff;color:#000}
.rg{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.rg input{width:100%;max-width:220px;accent-color:#fff}
.rg output{width:42px;text-align:right;color:var(--mut);font-size:12px}
.clr{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.clr input[type=color]{width:44px;height:30px;border:1px solid var(--s3);border-radius:8px;background:none;padding:2px;cursor:pointer}
.clr.off input{opacity:.35}
.clr .hex{font-size:12px;color:var(--mut);width:62px;text-align:right}
.imgc{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.imt{width:44px;height:44px;border-radius:50%;background:var(--s3) center/cover no-repeat;flex:none;border:1px solid var(--line)}
.imt.bg{border-radius:8px;width:72px}
.fr textarea{width:100%;min-height:62px;resize:vertical;border-radius:8px;background:var(--s2);border:1px solid var(--s3);padding:8px 10px;outline:0;font-size:13px}
.fr textarea:focus{border-color:#fff}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:.15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:#4ade80}
.sw input:checked+span::after{transform:translateX(18px)}
.pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pre button{height:58px;border-radius:10px;border:1px solid var(--s3);font-size:11px;font-weight:700;display:flex;align-items:flex-end;padding:6px 8px;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.pre button:hover{border-color:#fff}
.rall{display:flex;justify-content:center;padding:6px 0 18px}

/* drag handles + sortable lists */
.r.g{grid-template-columns:22px 26px 36px minmax(0,1fr) auto;gap:8px}
.r.g .ib{width:30px}
.grip{width:22px;height:34px;display:grid;place-items:center;color:var(--dim);font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
.grip:hover{color:#fff;background:var(--s3)}
.grip.off{opacity:.2;cursor:default;pointer-events:none}
.r.drag,.ro.drag{position:relative;z-index:30;background:var(--s3);box-shadow:0 8px 24px rgba(0,0,0,.55);cursor:grabbing;transition:none}
.r.dropb,.ro.dropb{box-shadow:inset 0 2px 0 #fff}
.r.dropa,.ro.dropa{box-shadow:inset 0 -2px 0 #fff}
.ro{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;min-height:46px}
.ro:hover{background:var(--s2)}
.ro .nm{font-weight:600;font-size:14px}
.ro small{color:var(--mut);font-size:12px}
.rolist{margin:8px -4px 4px;max-height:56svh;overflow:auto}
.pbar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;width:0;background:#fff;transition:width .4s}
.imp{margin:6px -4px 0;max-height:46svh;overflow:auto}
.imr{display:flex;align-items:center;gap:10px;padding:6px 4px}
.ims{width:22px;flex:none;text-align:center;font-size:13px;color:var(--dim)}
.ims.done{color:#fff}.ims.failed{color:#ff6b6b}.ims.processing{color:#fff;animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="hd"><span class="brand"><i></i>@playlists</span><span class="sub">Manage</span><span class="sp"></span><a class="pill" id="view" href="/" hidden>View playlist</a></header>
  <div class="state" id="gate">Signing in…</div>

  <nav class="tabs" id="tabs" hidden><button class="t on" data-tab="songs">Songs</button><button class="t" data-tab="look">Appearance</button><span class="sp"></span><span class="st" id="saveSt"></span></nav>

  <main id="app" hidden>
    <h1 id="title">Your playlist</h1>
    <div class="meta" id="meta"></div>
    <nav class="chips" id="chips" aria-label="Capsules"></nav>
    <div class="tb">
      <label class="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.5 11.3l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg><input type="search" id="q" placeholder="Search" aria-label="Search songs"></label>
      <button class="pill" id="bFilter">Filter</button>
      <button class="pill" id="bSelAll" hidden>Select all</button>
      <span class="sp"></span>
      <span class="tools" id="capTools" hidden><button class="pill pri" id="bPick">+ Add songs</button><button class="pill" id="bRen">Rename</button><button class="pill" id="bDel">Delete capsule</button></span>
    </div>
    <div class="flt" id="flt" hidden></div>
    <div id="rows"></div>
    <div class="more" id="more"></div>
  </main>

  <section id="look" hidden>
    <div class="lk">
      <div class="pvc"><div class="pvh"><span>Live preview · this is your real page</span></div><iframe class="pvf" id="pv" title="Playlist preview"></iframe></div>
      <div class="ctl" id="ctl"></div>
    </div>
  </section>
</div>
<div class="selbar" id="selbar" hidden><b class="num" id="selN"></b><button class="pill pri" id="bAdd">Add to capsule</button><button class="pill" id="bRm">Remove</button><button class="pill" id="bClr">Clear</button></div>
<div class="ov" id="ov"></div><div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = { me: null, user: null, caps: [], scope: 'all', songs: [], q: '', artist: '', genre: '', page: 0, pages: 1, total: 0, ver: 0, pending: null, ac: null, failed: false,
    sel: new Set(), tab: 'songs', facets: null, theme: {}, allCount: 0, list: [], drag: false, dirty: false };
  const UP = '<svg viewBox="0 0 24 24"><path d="M12 6l7 7-1.4 1.4L13 9.8V19h-2V9.8l-4.6 4.6L5 13z"/></svg>';
  const DN = '<svg viewBox="0 0 24 24"><path d="M12 18l-7-7 1.4-1.4L11 14.2V5h2v9.2l4.6-4.6L19 11z"/></svg>';
  const RM = '<svg viewBox="0 0 24 24"><path d="M6.4 5L12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>';
  const GRIP = '<svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>';
  const SYNC = '<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 016 6c0 1-.25 1.97-.7 2.8l1.46 1.46A8 8 0 0012 4zm0 14a6 6 0 01-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A8 8 0 0012 20v3l4-4-4-4v3z"/></svg>';
  const SEARCH = '<svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.5 11.3l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const img = s => s.image_url || s.poster_url || s.cover_url || '';
  const thumb = s => img(s) ? `<img loading="lazy" decoding="async" src="${esc(img(s))}" alt="">` : '♪';
  const name = u => [u.first_name, u.last_name].filter(Boolean).join(' ') || (u.username ? '@' + u.username : 'User ' + u.user_id);
  const H = { 'X-Requested-With': 'playlist', 'Content-Type': 'application/json' };
  const qs = o => Object.entries(o).filter(([, v]) => v).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const skRows = n => Array.from({ length: n }, (_, i) => `<div class="skr"><span class="sk" style="width:36px;height:36px"></span><span style="display:grid;gap:6px"><span class="sk" style="height:11px;width:${40 + (i * 17) % 40}%"></span><span class="sk" style="height:9px;width:28%"></span></span></div>`).join('');

  document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);
  document.addEventListener('error', e => { if (e.target.tagName === 'IMG') { e.target.classList.add('ld'); e.target.style.display = 'none'; } }, true);
  const settle = (root = document) => root.querySelectorAll('img:not(.ld)').forEach(i => { if (i.complete) { if (i.naturalWidth) i.classList.add('ld'); else i.style.display = 'none'; } });

  // ---- overlay, toast, requests ----
  const ov = $('ov');
  const showBox = (h, cls = '') => { ov.innerHTML = `<div class="box ${cls}">${h}</div>`; ov.classList.add('show'); };
  const hideBox = () => { ov.classList.remove('show'); ov.innerHTML = ''; };
  ov.addEventListener('click', e => { if (e.target === ov) hideBox(); });
  let tt; const toast = m => { const e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2600); };
  const gate = m => { $('gate').textContent = m; $('gate').hidden = false; $('app').hidden = true; $('look').hidden = true; $('tabs').hidden = true; $('selbar').hidden = true; };
  async function api(method, p, body) {
    const r = await fetch(p, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { gate('Session expired. Reopen this page from Telegram.'); throw new Error('Session expired'); }
    if (!r.ok) throw Object.assign(new Error(d.error || 'Request failed'), { data: d });
    return d;
  }
  const getJson = async (u, signal) => { const r = await fetch(u, { headers: { Accept: 'application/json' }, signal }); if (!r.ok) throw new Error(r.status === 404 ? 'Not found' : 'Failed to load (' + r.status + ')'); return r.json(); };
  const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
  function ask(title, { value = null, ok = 'Save', note = '' } = {}) {   // text prompt (value !== null) or confirm
    return new Promise(res => {
      showBox(`<h3 class="bt">${esc(title)}</h3>${note ? `<p class="a">${esc(note)}</p>` : ''}${value !== null ? `<input id="mi" maxlength="40" value="${esc(value)}" autocomplete="off">` : ''}<div class="btns"><button class="b" id="mc">Cancel</button><button class="b pri" id="mo">${esc(ok)}</button></div>`);
      const i = $('mi'); if (i) { i.focus(); i.select(); i.addEventListener('keydown', e => e.key === 'Enter' && $('mo').click()); }
      const done = v => { hideBox(); res(v); };
      $('mc').onclick = () => done(null); $('mo').onclick = () => done(i ? i.value.trim() || null : true);
    });
  }

  // ---- drag to reorder: grab the dots, drop where it should go (works with touch and mouse) ----
  function sortable(box, { item, handle, scroller, onStart, onEnd, onDrop }) {
    box.addEventListener('pointerdown', e => {
      const h = e.target.closest(handle); if (!h || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const el = h.closest(item); if (!el || !box.contains(el)) return;
      e.preventDefault();
      const pos = () => scroller ? scroller.scrollTop : scrollY, s0 = pos(), y0 = e.clientY;
      const from = [...box.querySelectorAll(item)].indexOf(el);
      let py = e.clientY, to = from, raf = 0;
      const clear = () => box.querySelectorAll('.dropb,.dropa').forEach(x => x.classList.remove('dropb', 'dropa'));
      const place = () => {
        el.style.transform = `translateY(${py - y0 + pos() - s0}px)`;
        const others = [...box.querySelectorAll(item)].filter(x => x !== el);
        let n = 0; for (const o of others) { const r = o.getBoundingClientRect(); if (r.top + r.height / 2 < py) n++; else break; }
        clear(); if (others.length) others[Math.min(n, others.length - 1)].classList.add(n < others.length ? 'dropb' : 'dropa');
        to = n;
      };
      const tick = () => {   // edge auto-scroll while dragging (keeps clear of the sticky bars on the page)
        const r = scroller ? scroller.getBoundingClientRect() : { top: 96, bottom: innerHeight - 96 };
        const z = 56, d = py < r.top + z ? -Math.min(18, (r.top + z - py) / 3) : py > r.bottom - z ? Math.min(18, (py - (r.bottom - z)) / 3) : 0;
        if (d) { scroller ? (scroller.scrollTop += d) : scrollBy(0, d); place(); }
        raf = requestAnimationFrame(tick);
      };
      const mv = ev => { py = ev.clientY; place(); };
      const end = ev => {
        cancelAnimationFrame(raf); clear();
        h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', end); h.removeEventListener('pointercancel', end);
        try { h.releasePointerCapture(e.pointerId); } catch {}
        el.classList.remove('drag'); el.style.transform = '';
        onEnd && onEnd();
        if (ev.type === 'pointerup' && to !== from) onDrop(from, to);
      };
      el.classList.add('drag'); onStart && onStart();
      try { h.setPointerCapture(e.pointerId); } catch {}
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
      place(); raf = requestAnimationFrame(tick);
    });
  }

  // capsule order: the top one is shown first on your page ("All" can be moved too)

    draw(); $('roDone').onclick = hideBox;
    sortable($('ro'), { item: '.ro', handle: '.grip', scroller: $('ro'), onDrop: async (from, to) => {
      const [m] = items.splice(from, 1); items.splice(to, 0, m); draw();

  const url = p => `/playlist/${S.me}?format=json&page=${p}&${qs({ q: S.q, capsule: S.scope, artist: S.artist, genre: S.genre })}`;
  function load(reset) {

  $('flt').addEventListener('click', guard(async e => {

      : `<div class="state">${S.q || S.artist || S.genre ? 'No songs match' + (S.q ? ' “' + esc(S.q) + '”' : '') : S.scope === 'all' ? 'No songs yet' : isGenreCap() ? 'No songs with this genre right now. New ones will appear here on their own.' : 'Empty capsule. Tap “+ Add songs” to fill it.'}</div>`;

  function renderSel() {

  // ======================= import from Spotify =======================
  // The server owns the job (POST /me/imports/spotify), this page only polls it, so closing the dialog or reloading loses nothing:
  // the job id lives in the page URL (?import=<id>) and, failing that, any running import is picked up from GET /me/imports on load.
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let impTok = 0;
  const impUrl = id => { try { const u = new URL(location.href); id ? u.searchParams.set('import', id) : u.searchParams.delete('import'); history.replaceState(null, '', u); } catch {} };
  const IMS = { pending: '·', processing: '↓', done: '✓', failed: '✕', cancelled: '–' };

  function importMenu() {
    showBox(`<h3 class="bt">Import from Spotify</h3><p class="a">Paste a public playlist link. The first 50 songs go into a new capsule.</p>
      <input id="spu" maxlength="300" inputmode="url" placeholder="https://open.spotify.com/playlist/…" autocomplete="off">
      <div class="btns"><button class="b" id="spc">Cancel</button><button class="b pri" id="spo">Import</button></div>`);
    const i = $('spu'); i.focus(); i.addEventListener('keydown', e => e.key === 'Enter' && $('spo').click());
    $('spc').onclick = hideBox;
    $('spo').onclick = guard(async () => {
      const url = i.value.trim(); if (!url) return;
      const b = $('spo'); b.disabled = true; b.textContent = 'Reading playlist…';
      try { const d = await api('POST', '/me/imports/spotify', { url }); S.facets = null; await loadCaps(); renderChips(); trackImport(d.id); }
      catch (e) { if (e.data && e.data.import_id) return trackImport(e.data.import_id); b.disabled = false; b.textContent = 'Import'; throw e; }
    });
  }

  function openImportBox() {
    showBox(`<div id="imB"><h3 class="bt" id="imH">Starting…</h3><p class="a" id="imS"></p><div class="pbar"><i id="imP"></i></div><div class="imp" id="imL"></div><div class="btns" id="imBt"></div></div>`);
  }
  let impRows = '', impBtn = '';
  function paintImport(d) {
    if (!$('imB')) return;   // dialog is closed or replaced: the poll keeps going, only the painting stops
    const c = d.counts || {}, fin = (c.done || 0) + (c.failed || 0) + (c.cancelled || 0), run = d.status === 'running';
    $('imH').textContent = run ? `Importing ${fin} of ${d.total}` : d.status === 'done' ? `Done · ${c.done} songs added` : d.status === 'partial' ? `${c.done} added · ${c.failed} failed` : d.status === 'cancelled' ? 'Cancelled · the capsule was deleted' : 'Import failed';
    $('imS').textContent = `“${d.capsule_name}”${d.playlist_total > d.total ? ` · first ${d.total} of ${d.playlist_total} songs` : ''}`;
    $('imP').style.width = (d.total ? Math.round(fin / d.total * 100) : 0) + '%';
    const rows = d.items.map(x => {
      const retrying = x.status === 'pending' && x.attempts > 0, sub = x.status === 'failed' ? x.error || 'Failed' : retrying ? `Retrying (attempt ${x.attempts + 1})…` : x.artist || '';
      return `<div class="imr"><span class="th">${x.image ? `<img loading="lazy" decoding="async" src="${esc(x.image)}" alt="">` : '♪'}</span><span style="min-width:0;flex:1"><div class="t ell">${esc(x.title || 'Unknown')}</div><div class="a ell">${esc(sub)}</div></span><span class="ims ${x.status}">${IMS[x.status] || ''}</span></div>`;
    }).join('');
    if (rows !== impRows) { const L = $('imL'), t = L.scrollTop; L.innerHTML = rows; L.scrollTop = t; impRows = rows; settle(L); }   // only touch the list when it changed (no image flicker)
    const btn = d.status + (c.failed ? 'f' : '');
    if (btn !== impBtn) {   // same for the buttons, so a tap is never swallowed by a refresh
      impBtn = btn;
      $('imBt').innerHTML = (c.failed && !run ? '<button class="b" id="imR">Retry failed</button>' : '') + (run ? '<button class="b pri" id="imX">Hide</button>' : '<button class="b pri" id="imO">' + (d.status === 'cancelled' || d.status === 'failed' && !c.done ? 'Close' : 'Open capsule') + '</button>');
      if ($('imX')) $('imX').onclick = hideBox;
      if ($('imO')) $('imO').onclick = guard(async () => { impUrl(null); hideBox(); if (d.status === 'cancelled' || !c.done) return; await loadCaps(); select(d.capsule_id); });
      if ($('imR')) $('imR').onclick = guard(async () => { $('imR').disabled = true; await api('POST', `/me/imports/${d.id}/retry`); trackImport(d.id); });
    }
  }

  async function trackImport(id) {
    const tok = ++impTok; impUrl(id); impRows = impBtn = ''; openImportBox();
    for (let errs = 0; ; ) {
      let d;
      try { d = await api('GET', `/me/imports/${encodeURIComponent(id)}`); errs = 0; }
      catch (e) {
        if (tok !== impTok || /expired/i.test(e.message)) return;
        if (/not found/i.test(e.message)) { impUrl(null); if ($('imB')) hideBox(); return toast('That import is no longer available'); }
        if ($('imB') && ++errs > 2) $('imS').textContent = 'Connection lost, retrying…';   // the server keeps working; we just keep asking
        await wait(3000); continue;
      }
      if (tok !== impTok) return;
      paintImport(d);
      if (d.status !== 'running') {
        S.facets = null; try { await loadCaps(); renderChips(); } catch {}
        if (!$('imB')) { impUrl(null); toast(`Spotify import finished · ${d.counts.done || 0} added${d.counts.failed ? `, ${d.counts.failed} failed` : ''}`); }
        return;
      }
      await wait(1500);
    }
  }

  async function resumeImport() {
    try {
      const id = new URLSearchParams(location.search).get('import');
      if (id) return trackImport(id);
      const run = (await api('GET', '/me/imports')).imports.find(i => i.status === 'running');
      if (run) trackImport(run.id);
    } catch {}
  }

  // ======================= tabs =======================
  function tab(t) {
    S.tab = t; $('wrap').classList.toggle('wide', t === 'look');
    document.querySelectorAll('.tabs .t').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $('app').hidden = t !== 'songs'; $('look').hidden = t !== 'look'; renderSel();
    const el = $(t === 'songs' ? 'app' : 'look'); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
    if (t === 'look') { if (!$('pv').getAttribute('src')) $('pv').src = `/playlist/${S.me}?preview=1`; sync(); pv(); } else maybeMore();
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) tab(b.dataset.tab); });

  (async () => {
    if (!(await signIn())) return gate('Open this page from Telegram: send /manage to the bot in a private chat.');
    try { await Promise.all([loadCaps(), loadTheme()]); } catch (e) { return gate(e.message); }
    $('gate').hidden = true; $('tabs').hidden = false; $('view').hidden = false; $('view').href = `/playlist/${S.me}`;
    buildLook(); select('all'); tab('songs'); resumeImport();
  })();
})();
</script>
</body>
</html>
